name: Build wheels

# Build distributable Python wheels for ball-py via cibuildwheel.
# Runs on PR to validate the wheel build; on push to default branch
# uploads the wheels as workflow artifacts; on tag push (v*) uploads
# the same wheels to PyPI as a release.
#
# This is the slow workflow — full BALL C++ compile inside a
# manylinux2014 container per Python version. Roughly 30–45 min per
# matrix cell. python-smoke.yml is the fast feedback path; this is
# the publication path.
#
# Maintainer note: PyPI publishing uses Trusted Publishing (OIDC), so
# no API token secret is needed in the repo. The publishing step
# below assumes the project is registered at
#   https://pypi.org/manage/account/publishing/
# with this repo / workflow as a trusted publisher. If that has not
# been set up, the upload step is a no-op until it is.

on:
  pull_request:
    paths:
      - "python/**"
      - "source/**"
      - "include/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - ".github/workflows/build-wheels.yml"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        # macos / windows can join later once the manylinux story is
        # stable; BALL's Qt5 + Boost + Eigen dependency chain is
        # heavier on those runners and is not v0.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python (host, for cibuildwheel)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23
        env:
          # Build wheels for the supported Python range. cp311-cp313
          # matches pyproject.toml's requires-python = ">=3.11" and
          # the smoke matrix above. cp310 was dropped to align with
          # proteon's >=3.11 floor and shave ~25% off wheel-build
          # wall time; 3.10 reaches EOL 2026-10 anyway.
          CIBW_BUILD: "cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64"
          # manylinux_2_34 = AlmaLinux 9, glibc 2.34. EL9 ships Qt5
          # (qt5-qtbase-devel, AppStream), which is what BALL v1.6
          # links against — see CIBW_BEFORE_ALL_LINUX below.
          # Cost of the image choice: the resulting wheels require glibc >= 2.34
          # on consumer systems, i.e. Ubuntu 22.04+ / Debian 12+ /
          # RHEL 9+ / Fedora 36+. Older distros fall back to building
          # from source via pyproject.toml + scikit-build-core.
          #
          # Pinned to cibuildwheel v2.23. v2.21 assumed a cp38
          # interpreter inside the container for its before-all env
          # dump; current manylinux_2_34 images no longer ship Python
          # 3.8 (EOL), so 2.21 aborted with exit 127 before any wheel
          # was built. The explicit quay.io image path is kept — it
          # resolves on any cibuildwheel version.
          CIBW_MANYLINUX_X86_64_IMAGE: "quay.io/pypa/manylinux_2_34_x86_64:latest"
          # System deps inside the container — Qt5 / Boost / Eigen /
          # FFTW are not in the manylinux image by default. BALL v1.6
          # links Qt5 5.15 (CMakeLists.txt FIND_PACKAGE(Qt5), required
          # unconditionally for Core/Network/Xml). epel-release is
          # added for eigen3-devel; CRB (CodeReady Builder) for the
          # remaining -devel packages.
          CIBW_BEFORE_ALL_LINUX: |
            dnf install -y epel-release
            /usr/bin/crb enable
            dnf install -y \
                qt5-qtbase-devel \
                boost-devel \
                eigen3-devel \
                fftw-devel \
                flex bison \
                bzip2-devel libzstd-devel
          # Repair: bundle libBALL.so + Qt5 + Boost into the wheel
          # so end users do not need them at install time. auditwheel
          # walks the .so's NEEDED list and pulls referenced libs.
          #
          # libBALL.so lives in scikit-build-core's per-wheel build
          # dir (`build/{wheel_tag}/lib`); auditwheel does not search
          # there by default, so the bare `auditwheel repair` aborts
          # with "required library libBALL.so.1.5 could not be
          # located" even though the file exists. Prepend every such
          # directory under /project/build to LD_LIBRARY_PATH at
          # repair time so auditwheel can resolve the wheel's NEEDED
          # list and bundle the deps under ball.libs/.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            BUILD_LIB_DIRS=$(find /project/build -type d -name lib 2>/dev/null | tr '\n' ':') &&
            LD_LIBRARY_PATH="${BUILD_LIB_DIRS}${LD_LIBRARY_PATH}"
            auditwheel repair -w {dest_dir} {wheel}
          # Smoke each wheel on the manylinux runner before upload.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >
            python -c "import ball; print(ball.amber_energy.__doc__[:80])"

      - name: Upload wheels as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: build-wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: pypi-publish
    permissions:
      # Trusted publishing — no PyPI token needed in the repo
      # secrets, the OIDC flow proves identity to PyPI.
      id-token: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
